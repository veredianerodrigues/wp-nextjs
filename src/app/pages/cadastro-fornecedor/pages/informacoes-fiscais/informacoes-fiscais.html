<div class="form-container">
  <div class="form-header">
    <h1>Informações Fiscais</h1>
    <p>Informe os dados fiscais da empresa</p>
  </div>

  <form [formGroup]="taxForm" (ngSubmit)="onSubmit()">
    <div class="form-section">
      <div class="form-grid">
        <div class="form-field">
          <label for="regimeTributario">Regime Tributário <span class="required">*</span></label>
          <select id="regimeTributario" formControlName="regimeTributario">
            <option value="">Selecione</option>
            <option value="simples">Simples Nacional</option>
            <option value="presumido">Lucro Presumido</option>
            <option value="real">Lucro Real</option>
          </select>
        </div>

        <div class="form-field">
          <label for="aliquotaIss">Alíquota ISS (%)</label>
          <input type="text" id="aliquotaIss" formControlName="aliquotaIss" placeholder="0.00" />
        </div>

        <div class="form-field">
          <label for="retencaoIr">Retenção IR (%)</label>
          <input type="text" id="retencaoIr" formControlName="retencaoIr" placeholder="0.00" />
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="voltar()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Voltar
      </button>
      <button type="submit" class="btn-primary">
        Finalizar Cadastro
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </div>
  </form>
</div>
