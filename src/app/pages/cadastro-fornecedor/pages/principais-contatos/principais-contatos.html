<div class="form-container">
  <div class="form-header">
    <h1>Principais Contatos</h1>
    <p>Informe os principais contatos da empresa</p>
  </div>

  <form [formGroup]="contactsForm" (ngSubmit)="onSubmit()">
    <div class="form-section">
      <div class="form-grid">
        <div class="form-field">
          <label for="nomeContato">Nome do Contato <span class="required">*</span></label>
          <input type="text" id="nomeContato" formControlName="nomeContato" placeholder="Nome completo" />
        </div>

        <div class="form-field">
          <label for="cargoContato">Cargo</label>
          <input type="text" id="cargoContato" formControlName="cargoContato" placeholder="Cargo na empresa" />
        </div>

        <div class="form-field">
          <label for="emailContato">E-mail <span class="required">*</span></label>
          <input type="email" id="emailContato" formControlName="emailContato" placeholder="email@exemplo.com" />
        </div>

        <div class="form-field">
          <label for="telefoneContato">Telefone <span class="required">*</span></label>
          <input type="text" id="telefoneContato" formControlName="telefoneContato" placeholder="(00) 00000-0000" />
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="voltar()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Voltar
      </button>
      <button type="submit" class="btn-primary">
        Avançar
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </form>
</div>
